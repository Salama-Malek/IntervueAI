<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IntervueAI Mobile Mock</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        font-family: 'Space Grotesk', sans-serif;
        background: #05010a;
        color: white;
        padding: 1rem;
      }
      .card {
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 24px;
        padding: 1rem;
        margin-bottom: 1rem;
        background: rgba(2, 2, 2, 0.7);
      }
      .pill {
        display: inline-flex;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        padding: 0.35rem 0.9rem;
        font-size: 0.65rem;
        letter-spacing: 0.35em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.65);
      }
      button {
        width: 100%;
        border-radius: 999px;
        padding: 0.85rem;
        border: none;
        background-image: linear-gradient(120deg, #10b981, #38bdf8);
        color: white;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-size: 0.7rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="pill">Ops deck</p>
      <h1 style="margin-top:0.5rem;font-size:1.5rem;">Practice monitor</h1>
      <p style="color:rgba(255,255,255,0.7);font-size:0.9rem;">
        Track transcripts and KPIs in one scrollable board.
      </p>
      <button>Begin</button>
    </div>
    <div class="card">
      <p style="letter-spacing:0.35em;font-size:0.65rem;color:rgba(255,255,255,0.5);">Transcript</p>
      <p style="font-size:0.85rem;color:rgba(255,255,255,0.65);">Live log placeholder</p>
    </div>
    <div class="card">
      <p style="letter-spacing:0.35em;font-size:0.65rem;color:rgba(255,255,255,0.5);">Playback log</p>
      <p style="font-size:0.85rem;color:rgba(255,255,255,0.65);">No sessions yet. Run an interview to light up this list.</p>
    </div>
  </body>
</html>
